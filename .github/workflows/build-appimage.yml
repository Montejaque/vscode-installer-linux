name: Build and publish Linux AppImage

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Versión a publicar (por ejemplo, v1.0.0)"
        required: true
        default: "v1.0.0"
        type: string
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: vscode-installer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-tk python3-venv python3-pip squashfs-tools file desktop-file-utils

      - name: Build standalone GUI executable
        run: |
          python3 -m pip install --user --upgrade pyinstaller
          python3 -m PyInstaller --noconfirm --clean --onefile --windowed --name vscode-installer-updater src/vscode_manager.py
          test -s dist/vscode-installer-updater
          file dist/vscode-installer-updater

      - name: Prepare AppDir
        run: |
          chmod +x AppDir/AppRun
          mkdir -p AppDir/usr/bin dist
          install -m 0755 dist/vscode-installer-updater AppDir/usr/bin/vscode-installer-updater
          test -f AppDir/vscode-installer-updater.desktop
          test -f AppDir/vscode-installer-updater.svg
          desktop-file-validate AppDir/vscode-installer-updater.desktop

      - name: Download appimagetool
        run: |
          curl --fail --location --retry 3 https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage --output appimagetool
          chmod +x appimagetool

      - name: Build AppImage
        env:
          ARCH: x86_64
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          ./appimagetool AppDir dist/VSCode-Installer-Updater-x86_64.AppImage
          chmod +x dist/VSCode-Installer-Updater-x86_64.AppImage
          file dist/VSCode-Installer-Updater-x86_64.AppImage
          test -s dist/VSCode-Installer-Updater-x86_64.AppImage

      - name: Smoke test bundled executable
        run: |
          ./dist/vscode-installer-updater --help || true
          test -x dist/VSCode-Installer-Updater-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: VSCode-Installer-Updater-x86_64-AppImage
          path: dist/VSCode-Installer-Updater-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v1.0.0' }}
          target_commitish: main
          name: VS Code Installer Updater ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v1.0.0' }}
          generate_release_notes: true
          files: dist/VSCode-Installer-Updater-x86_64.AppImage
