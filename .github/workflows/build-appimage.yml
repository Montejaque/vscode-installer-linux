name: Build and publish Linux AppImage

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vscode-installer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build executable against Ubuntu 20.04 libraries
        run: |
          docker run --rm -v "$PWD:/work" -w /work ubuntu:20.04 bash -lc '
            set -eux
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y python3 python3-pip python3-tk python3-dev build-essential
            python3 -m pip install --user --upgrade "pip<22" "pyinstaller==6.19.0"
            export PATH="$HOME/.local/bin:$PATH"
            python3 -m PyInstaller --noconfirm --clean --onefile --name vscode-installer-updater src/vscode_manager.py
            test -s dist/vscode-installer-updater
            file dist/vscode-installer-updater
          '
          sudo chown -R "$(id -u):$(id -g)" dist AppDir

      - name: Prepare AppDir
        run: |
          chmod +x AppDir/AppRun
          mkdir -p AppDir/usr/bin dist
          install -m 0755 dist/vscode-installer-updater AppDir/usr/bin/vscode-installer-updater
          test -f AppDir/vscode-installer-updater.desktop
          test -f AppDir/vscode-installer-updater.svg
          sudo apt-get update
          sudo apt-get install -y squashfs-tools file desktop-file-utils
          desktop-file-validate AppDir/vscode-installer-updater.desktop

      - name: Download appimagetool
        run: |
          curl --fail --location --retry 3 https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage --output appimagetool
          chmod +x appimagetool

      - name: Build AppImage
        env:
          ARCH: x86_64
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          ./appimagetool AppDir dist/VSCode-Installer-Updater-x86_64.AppImage
          chmod +x dist/VSCode-Installer-Updater-x86_64.AppImage
          file dist/VSCode-Installer-Updater-x86_64.AppImage
          test -s dist/VSCode-Installer-Updater-x86_64.AppImage

      - name: Smoke test bundled executable
        run: |
          docker run --rm -v "$PWD:/work" -w /work ubuntu:20.04 bash -lc '
            set -eux
            ./dist/vscode-installer-updater --version || true
            test -x dist/VSCode-Installer-Updater-x86_64.AppImage
          '

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: VSCode-Installer-Updater-x86_64-AppImage
          path: dist/VSCode-Installer-Updater-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          target_commitish: main
          name: VS Code Installer Updater ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          generate_release_notes: true
          files: dist/VSCode-Installer-Updater-x86_64.AppImage
